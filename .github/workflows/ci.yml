name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          # - macOS-latest
          # - windows-latest
        arch:
          - x64
        exclude:
          - os: macOS-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Coverage costs ~38% of the run (measured cold on testsearchgraph.jl, 2 threads:
          # 103s -> 143s) and nothing consumes it -- there is no codecov/lcov step in any
          # workflow. It also forces the package to be recompiled instrumented, which throws
          # away what julia-actions/cache restores. Turn it on in a job of its own if the
          # numbers are ever wanted.
          coverage: false
        env:
          JULIA_NUM_THREADS: auto

